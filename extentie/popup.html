<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<title>Social opvolglijst</title>
<style>
  html, body { margin: 0; min-height: 100vh; overflow-x: hidden; }
  body {
    box-sizing: border-box;
    width: 600px;
    max-width: 100vw;
    padding: 12px;
    font-family: system-ui, sans-serif;
  }
  h1 { font-size: 15px; margin: 0; }
  .kopRij { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .taalRij { display: flex; align-items: center; gap: 5px; }
  .taalRij label { font-size: 11px; color: #777; }
  #taalSelect { width: auto; padding: 3px 4px; font-size: 11px; }
  .projectRij { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; margin-bottom: 8px; }
  .projectNaamRij { display: flex; gap: 6px; margin-bottom: 8px; }
  .projectNaamRij[hidden] { display: none; }
  select, input[type=text] { width: 100%; box-sizing: border-box; padding: 5px; font-size: 12px; }
  #lijst { max-height: 260px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; }
  .item { padding: 8px; border-bottom: 1px solid #eee; font-size: 12px; }
  .item.verborgen { background: #f8f8f8; }
  .item:last-child { border-bottom: none; }
  .itemKop { display: flex; align-items: center; gap: 5px; }
  .meta { flex: 1; color: #777; font-size: 11px; overflow-wrap: anywhere; }
  .icoonKnop { flex: none; width: auto; padding: 2px 7px; font-size: 12px; line-height: 1.4; border: 1px solid #ccc; background: #f5f5f5; color: #333; border-radius: 4px; cursor: pointer; }
  .icoonKnop:hover { background: #e9e9e9; }
  .icoonKnop.vuilbak { padding: 4px 6px; display: flex; align-items: center; }
  .icoonKnop.vuilbak svg { width: 12px; height: 12px; display: block; }
  .icoonKnop.ster { position: relative; padding: 3px 5px; display: flex; align-items: center; color: #999; }
  .icoonKnop.ster svg { width: 16px; height: 16px; display: block; }
  .icoonKnop.ster.actief { color: #d3860a; }
  .icoonKnop.ster.actief svg { fill: #f5a623; stroke: #d3860a; }
  .sterCijfer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); font-size: 9px; font-weight: 700; color: #5c3b00; pointer-events: none; line-height: 1; }
  .verwerktLabel { flex: none; display: flex; align-items: center; }
  .verwerktCheckbox { width: 14px; height: 14px; margin: 0; cursor: pointer; }
  .item.verwerkt .tekst { text-decoration: line-through; opacity: .6; }
  .paginaTitel { font-weight: 600; margin-top: 4px; margin-bottom: 3px; overflow-wrap: anywhere; }
  .beschrijving { color: #666; font-size: 11px; font-style: italic; margin-top: 4px; overflow-wrap: anywhere; }
  .tekst { line-height: 1.35; overflow-wrap: anywhere; }
  .bron { margin-top: 6px; font-size: 11px; overflow-wrap: anywhere; }
  .bron a { color: #0f5db8; text-decoration: none; }
  .bron a:hover { text-decoration: underline; }
  .screenshot { display: block; width: 100%; margin-top: 8px; border: 1px solid #ddd; border-radius: 4px; }
  .extraInfoLijst { margin-top: 8px; padding-top: 6px; border-top: 1px dashed #ddd; }
  .extraInfoTitel { font-weight: 600; font-size: 11px; color: #555; margin-bottom: 4px; }
  .extraInfoItem { display: flex; align-items: flex-start; gap: 6px; padding: 5px 0; border-top: 1px solid #f0f0f0; }
  .extraInfoItem:first-of-type { border-top: none; }
  .extraInfoInhoud { flex: 1; min-width: 0; }
  .extraInfoTekst { line-height: 1.35; overflow-wrap: anywhere; }
  .knoppen { margin-top: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  button { flex: 1; padding: 6px; font-size: 12px; cursor: pointer; }
  #samenvatting { margin-top: 10px; font-size: 12px; white-space: pre-wrap; background: #f7f7f7; padding: 8px; border-radius: 6px; display: none; }
  .samenvattingActies { margin-top: 6px; display: flex; gap: 6px; }
  .samenvattingActies[hidden] { display: none; }
  #apiKeyRij { margin-top: 10px; font-size: 11px; }
  input[type=password] { width: 100%; box-sizing: border-box; padding: 4px; font-size: 11px; }
  .leeg { padding: 12px; color: #999; font-size: 12px; text-align: center; }

  @media (min-height: 600px) {
    body { height: 100vh; display: flex; flex-direction: column; }
    #lijst { flex: 1 1 auto; min-height: 42px; max-height: none; }
  }
</style>
</head>
<body>
  <div class="kopRij">
    <h1 data-i18n="popup_titel">Verzamelde reacties</h1>
    <div class="taalRij">
      <label for="taalSelect" data-i18n="taal_label">Taal</label>
      <select id="taalSelect">
        <option value="nl">Nederlands</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
      </select>
    </div>
  </div>
  <div class="projectRij">
    <select id="projectSelect" data-i18n-aria-label="popup_projectSelectLabel" aria-label="Project selecteren"></select>
    <button id="nieuwProjectBtn" data-i18n="popup_nieuw">Nieuw</button>
    <button id="hernoemProjectBtn" data-i18n="popup_hernoem">Hernoem</button>
  </div>
  <div class="projectNaamRij" id="projectNaamRij" hidden>
    <input type="text" id="projectNaam" data-i18n-placeholder="popup_projectnaamPlaceholder" placeholder="Projectnaam" />
    <button id="bewaarProjectNaamBtn" data-i18n="popup_bewaar">Bewaar</button>
  </div>
  <div id="lijst"></div>

  <div class="knoppen">
    <button id="voegPaginaBtn" data-i18n="popup_voegPagina">Voeg pagina toe</button>
    <button id="samenvattenBtn" data-i18n="popup_samenvatten">Samenvatten met AI</button>
    <button id="kopieerProjectBtn" data-i18n="popup_kopieerProject">Kopieer projecttekst</button>
    <button id="exportBtn" data-i18n="popup_exportCsv">Exporteer CSV</button>
    <button id="wisBtn" data-i18n="popup_minimaliseerAlles">Minimaliseer alles</button>
    <button id="openGeschiedenisBtn" data-i18n="popup_openGeschiedenis">Open geschiedenisrapport</button>
  </div>

  <div id="samenvatting"></div>
  <div class="samenvattingActies" id="samenvattingActies" hidden>
    <button id="kopieerSamenvattingBtn" data-i18n="algemeen_kopieer">Kopieer</button>
    <button id="downloadSamenvattingBtn" data-i18n="algemeen_download">Download als tekstbestand</button>
  </div>

  <div id="apiKeyRij">
    <label data-i18n="popup_apiKeyLabel">Anthropic API-key (blijft lokaal opgeslagen):</label>
    <input type="password" id="apiKey" placeholder="sk-ant-..." />
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
