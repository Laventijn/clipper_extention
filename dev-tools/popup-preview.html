<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<title>Popup preview - Social opvolglijst</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #e9edf3;
    font-family: system-ui, sans-serif;
  }

  main {
    width: 420px;
  }

  h1 {
    font-size: 16px;
    font-weight: 650;
    margin: 0 0 10px;
  }

  .browser {
    border: 1px solid #ccd3dd;
    border-radius: 8px;
    background: white;
    box-shadow: 0 10px 30px rgb(15 23 42 / 16%);
    overflow: hidden;
  }

  .bar {
    height: 34px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #94a3b8;
  }

  iframe {
    display: block;
    width: 404px;
    height: 470px;
    border: 0;
    background: white;
  }
</style>
</head>
<body>
  <main>
    <h1>Preview popup</h1>
    <div class="browser">
      <div class="bar">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <iframe src="../extentie/popup.html" title="Popup preview"></iframe>
    </div>
  </main>
</body>
</html>
